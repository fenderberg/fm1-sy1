<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Synth Editor · SY1</title>
  <meta name="description" content="Load, play and edit Synth1 patches in your browser.">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
<main id="content" tabindex="-1">
  <div class="instrument">
    <header class="faceplate">
      <div class="model"><h1>Synth Editor</h1><span>SY1 · VIRTUAL ANALOG</span></div>
      <div class="patch-display"><label for="patch-name">PATCH NAME</label><input id="patch-name" maxlength="31" value="Init" autocomplete="off"><span id="source">Initial patch</span></div>
      <div class="file-actions"><button id="browse">Browse presets</button><button id="open">Open .sy1 / ZIP</button><button id="save">Save .sy1</button><button id="init">Init patch</button></div>
      <input id="file" type="file" accept=".sy1,.zip" hidden>
    </header>
    <section class="keyboard-row" aria-label="Audition patch">
      <div class="monitor"><button id="hold" aria-pressed="false">Hold C4</button><label>Octave <select id="octave" aria-label="Keyboard octave"></select></label></div>
      <div id="keyboard" aria-label="Piano keyboard"></div>
    </section>
    <p id="message" role="status">Play the keys with A–K. Hold C4 to hear changes as you edit.</p>
    <div class="tabs" id="sections" role="group" aria-label="Editor sections"></div>
    <div id="modules"></div>
  </div>
  <dialog id="library" aria-labelledby="browser-title">
    <header><h2 id="browser-title">Browse presets</h2><button id="close" aria-label="Close preset browser">Close</button></header>
    <label>Bank <select id="banks"></select></label>
    <label>Find a patch <input type="search" id="find" autocomplete="off" placeholder="Name or category"></label>
    <label>Patch <select id="presets" size="8"></select></label>
    <p id="bank-info"></p><p id="library-status" role="status"></p><button id="load" class="primary">Load patch</button>
  </dialog>
</main>
<script type="module" src="editor.js"></script>
</body>
</html>
