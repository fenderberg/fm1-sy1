# Build a release on GitHub: the firmware package, the browser emulator and the complete website, with the same
# checks as tools/publish_site.sh. It publishes nothing: download the artifact, then push the site and make the
# release from it. Start it from the Actions tab or: gh workflow run release.yml -f version=X.Y.Z
name: Release build
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, X.Y.Z"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Tools
        run: |
          pip install Pillow
          sh base/tools/get_toolchain.sh "$HOME/.jieli"
          # the package takes three files of JieLi's AC79 SDK (Apache-2.0): its SPL, cfg_tool and EQ table, from the
          # tested release AC79NN_SDK_V1.2.1 only; the build stops if they differ from base/tools/build.py's SDK_SHA256
          sdk="$HOME/fw-AC79_AIoT_SDK" t="$sdk/cpu/wl82/tools"
          git clone -q --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 --filter=blob:none --no-checkout             https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$sdk"
          git -C "$sdk" sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin /cpu/wl82/tools/cfg/eq_cfg_hw.bin
          git -C "$sdk" checkout -q
          python3 - "$t" <<'PY'
          import hashlib, re, sys
          from pathlib import Path
          ref = dict(re.findall(r'"([^"]+)": "([0-9a-f]{64})"', Path("base/tools/build.py").read_text().split("SDK_SHA256 = {")[1].split("}")[0]))
          bad = [r for r, h in ref.items() if hashlib.sha256((Path(sys.argv[1]) / r).read_bytes()).hexdigest() != h]
          print("SDK files:", ", ".join(ref), "->", "differ: " + ", ".join(bad) if bad else "match AC79NN_SDK_V1.2.1")
          sys.exit(1 if bad or len(ref) != 3 else 0)
          PY
      - name: Engine and app tests
        run: make test test-app test-web
      - name: Firmware, emulator and website
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain"
          V="${{ inputs.version }}"
          echo "$V" | grep -Eq '^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$' || { echo "version: X.Y.Z"; exit 1; }
          mkdir -p app/build
          set -o pipefail
          tools/publish_site.sh "$V" 2>&1 | tee "app/build/publish-$V.log"
          (cd app/build && sha256sum "sy1-$V.fwsc" > "SHA256SUMS.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: sy1-${{ inputs.version }}
          path: |
            app/build/sy1-${{ inputs.version }}.fwsc
            app/build/SHA256SUMS.txt
            app/build/publish-${{ inputs.version }}.log
            app/build/site/
          include-hidden-files: true
          if-no-files-found: error
