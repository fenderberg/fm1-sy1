<title>SY1 Patch Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen librarian. Library on the left, the FM-1's 1,024 slots on the right, staged changes in a sync bar below. */
:root {
  color-scheme: dark;
  --ground: #151617; --card: #1d1f20; --sheet: #252728; --raise: #303334;
  --ink: #f3efe5; --muted: #aba9a3; --rule: #393b3c; --edge: #5a5d5e;
  --red: #e64436; --amber: #f3bf64; --teal: #94d6af; --bad: #ff9c90; --sel: #343024;
  --c0: #f0795a; --c1: #7fb6e8; --c2: #f3bf64; --c3: #94d6af; --c4: #c9a0e8; --c5: #e88fc0; --c6: #8fd8d8; --c7: #8a8d8a;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 13px/1.4 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--raise); border: 1px solid var(--edge); border-radius: 4px; padding: 6px 11px; font-weight: 600; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--amber); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--red); border-color: var(--red); color: #fff8ee; }
button.quiet { background: none; border-color: transparent; color: var(--muted); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
input[type=search], input[type=text], input[type=number], select { background: #131516; border: 1px solid var(--edge); border-radius: 4px; padding: 6px 8px; min-width: 0; }
input[type=checkbox] { accent-color: var(--amber); width: 15px; height: 15px; margin: 0; flex: none; cursor: pointer; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

.top { border-top: 4px solid var(--red); border-bottom: 1px solid var(--rule); background: #1b1d1e; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top h1 { font-size: 16px; margin: 0; letter-spacing: -.02em; }
.tag { font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--amber); border: 1px solid var(--amber); border-radius: 3px; padding: 2px 6px; }
.conn { margin-left: auto; display: flex; align-items: center; gap: 7px; font: 10px var(--mono); letter-spacing: .08em; color: var(--muted); }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 8px var(--teal); }
.tabs { display: none; gap: 6px; width: 100%; }
.tabs button { flex: 1; }
.tabs button[aria-pressed=true] { border-color: var(--amber); color: var(--amber); }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; }
.pane > header { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 9px; border-bottom: 1px solid var(--rule); }
.head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.head h2 { font-size: 15px; margin: 0; letter-spacing: -.015em; }
.head .count { font: 11px var(--mono); color: var(--muted); }
.head .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.bar { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.bar input[type=search] { flex: 1 1 130px; }
.bar select { flex: 0 1 150px; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; background: none; border: 1px solid var(--rule); color: var(--muted); }
.chip b { font: 10px var(--mono); font-weight: 400; opacity: .8; }
.chip[aria-pressed=true] { background: var(--sel); border-color: var(--amber); color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none; display: inline-block; }
.c0 { background: var(--c0); } .c1 { background: var(--c1); } .c2 { background: var(--c2); } .c3 { background: var(--c3); }
.c4 { background: var(--c4); } .c5 { background: var(--c5); } .c6 { background: var(--c6); } .c7 { background: var(--c7); }

.list { flex: 1; min-height: 120px; overflow-y: auto; position: relative; overscroll-behavior: contain; }
.list > div { position: relative; }
.row { position: absolute; left: 0; right: 0; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid #2a2c2d; cursor: default; user-select: none; }
.row:hover { background: #232526; }
.row.sel { background: var(--sel); }
.row.drop { box-shadow: inset 0 2px 0 var(--amber); }
.row .no { width: 30px; flex: none; font: 11px var(--mono); color: var(--muted); }
.row .nm { flex: 1.5 1 0; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .bk { flex: 1 1 0; min-width: 0; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.empty .nm { font-weight: 400; color: #6d706d; }
.row.gone .nm { text-decoration: line-through; color: var(--bad); }
.row .ic { flex: none; width: 26px; height: 26px; padding: 0; background: none; border-color: transparent; color: var(--muted); font-size: 13px; }
.row .ic.on { color: var(--amber); }
.row select { flex: none; width: 70px; padding: 2px 4px; font-size: 11px; background: none; border-color: transparent; color: var(--muted); }
.row select:hover { border-color: var(--edge); }
.row input.rename { flex: 1.5 1 0; padding: 3px 6px; }
.badge { flex: none; width: 62px; font: 10px var(--mono); text-align: center; border-radius: 3px; padding: 2px 0; }
.badge.on { width: 38px; color: var(--teal); border: 1px solid #3d5a4a; }
.badge.new { color: #10231a; background: var(--teal); }
.badge.moved, .badge.edited { color: #2a2010; background: var(--amber); }
.badge.removed { color: #2b100d; background: var(--bad); }
.none { padding: 30px 14px; text-align: center; color: var(--muted); }

.cap { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.cap i { display: block; height: 100%; background: var(--amber); }
.map { display: grid; grid-template-columns: repeat(64, 1fr); gap: 1px; }
.map i { aspect-ratio: 1; border-radius: 1px; background: #2a2c2d; }
.map i.pend { outline: 1px solid var(--ink); outline-offset: -1px; }
.map i.hit { outline: 2px solid #fff; outline-offset: 0; position: relative; z-index: 1; }
.map i.dim { opacity: .22; }
.map i.drop { background: var(--amber); }
.maplabel { display: flex; justify-content: space-between; font: 10px var(--mono); color: var(--muted); }
.selbar { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; padding: 7px 10px; background: var(--sel); border-bottom: 1px solid var(--rule); font-size: 12px; }
.selbar input { width: 68px; }

details.menu { position: relative; }
details.menu > summary { list-style: none; cursor: pointer; background: var(--raise); border: 1px solid var(--edge); border-radius: 4px; padding: 6px 11px; font-weight: 600; }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu[open] > summary { border-color: var(--amber); }
.pop { position: absolute; right: 0; top: calc(100% + 5px); z-index: 5; width: 250px; background: var(--sheet); border: 1px solid var(--edge); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 12px 30px #0009; }
.pop button { text-align: left; background: none; border-color: transparent; font-weight: 500; }
.pop button:hover { background: var(--raise); }
.pop p { margin: 4px 6px; font-size: 11px; color: var(--muted); }
.pop .save { display: flex; gap: 5px; padding: 4px; }
.pop .save input { flex: 1; }
.pop .save button { background: var(--raise); border-color: var(--edge); }

.sync { border-top: 1px solid var(--rule); background: #1b1d1e; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sync .what { flex: 1 1 220px; min-width: 0; }
.sync .what b { font-weight: 600; }
.sync progress { width: 100%; height: 6px; accent-color: var(--red); display: block; margin-top: 5px; }
.sync .acts { display: flex; gap: 7px; }
#toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); max-width: min(520px, calc(100% - 32px)); background: var(--ink); color: #151617; padding: 9px 14px; border-radius: 5px; font-weight: 500; z-index: 20; box-shadow: 0 8px 24px #000a; }

@media (max-width: 820px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .tabs { display: flex; }
  body[data-tab=lib] #dev, body[data-tab=dev] #lib { display: none; }
  .row .bk { display: none; }
  .conn { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .row, .chip, button { transition: background-color .12s, border-color .12s; } }
</style>

<div class="top">
  <h1>SY1 Patch Manager</h1>
  <span class="tag">Design proposal · simulated FM-1</span>
  <span class="conn"><span class="led"></span>DEMO FM-1 CONNECTED</span>
  <div class="tabs"><button type="button" id="tab-lib" aria-pressed="true">Library</button><button type="button" id="tab-dev" aria-pressed="false">My FM-1</button></div>
</div>

<main>
  <section class="pane" id="lib" aria-labelledby="h-lib">
    <header>
      <div class="head"><h2 id="h-lib">Library</h2><span class="count" id="lcount"></span>
        <span class="right"><button type="button" class="primary" id="add" disabled>Add to FM-1 →</button></span></div>
      <div class="bar">
        <input type="search" id="lq" placeholder="Search name or bank…  ( / )" autocomplete="off" aria-label="Search the library">
        <select id="lbank" aria-label="Bank"></select>
        <select id="lsort" aria-label="Sort library"><option value="name">Sort: Name A–Z</option><option value="bank">Sort: Bank</option><option value="cat">Sort: Character</option></select>
      </div>
      <div class="chips" id="lchips"></div>
    </header>
    <div class="list" id="llist" tabindex="0" aria-label="Library sounds"><div></div></div>
  </section>

  <section class="pane" id="dev" aria-labelledby="h-dev">
    <header>
      <div class="head"><h2 id="h-dev">My FM-1</h2><span class="count" id="dcount"></span>
        <span class="right">
          <details class="menu" id="m-arr"><summary>Arrange ▾</summary><div class="pop">
            <p>Reorders the real slots. Nothing is written until you sync.</p>
            <button type="button" data-arr="gaps">Close gaps</button>
            <button type="button" data-arr="cat">Group by character, then A–Z</button>
            <button type="button" data-arr="name">Sort everything A–Z</button>
            <button type="button" data-arr="bank">Group by bank</button>
          </div></details>
          <details class="menu" id="m-sets"><summary>Sets ▾</summary><div class="pop">
            <p>A set is a saved layout of all 1,024 slots. Load one to stage it.</p>
            <div id="setlist"></div>
            <div class="save"><input type="text" id="setname" placeholder="Name this layout" aria-label="Set name"><button type="button" id="setsave">Save</button></div>
          </div></details>
        </span></div>
      <div class="cap" aria-hidden="true"><i id="capfill"></i></div>
      <div class="map" id="map" aria-label="Map of all 1,024 slots"></div>
      <div class="maplabel"><span>001</span><span id="maphint">Each square is a slot. Click one to jump to it.</span><span>1024</span></div>
      <div class="bar">
        <input type="search" id="dq" placeholder="Filter my FM-1…" autocomplete="off" aria-label="Filter slots">
        <label class="chip" style="cursor:pointer"><input type="checkbox" id="dempty"> Show empty slots</label>
        <label class="chip" style="cursor:pointer"><input type="checkbox" id="dpend"> Changes only</label>
      </div>
      <div class="chips" id="dchips"></div>
    </header>
    <div class="selbar" id="selbar" hidden>
      <b id="selcount"></b>
      <label for="moveto">Move to slot</label><input type="number" id="moveto" min="1" max="1024" value="1"><button type="button" id="move">Move</button>
      <button type="button" id="remove">Remove</button><button type="button" class="quiet" id="desel">Clear selection</button>
    </div>
    <div class="list" id="dlist" tabindex="0" aria-label="FM-1 slots"><div></div></div>
  </section>
</main>

<div class="sync">
  <div class="what"><span id="syncmsg"></span><progress id="prog" max="1" value="0" hidden></progress></div>
  <div class="acts"><button type="button" id="undo" disabled>Undo</button><button type="button" id="discard" disabled>Discard all</button><button type="button" class="primary" id="sync" disabled>Sync to FM-1</button></div>
</div>
<div id="toast" role="status" hidden></div>

let baseSlot = new Map(), curSlot = new Map(), libSlot = new Map();

let lcat = -1, dcat = -1, lfav = false, lnew = false, drag = null, sets = [];

// Example device contents: 190 library sounds in arbitrary order with a few gaps.
(function seed() {
  let a = 20261116; const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const ids = lib.map(p => p.id); for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  let s = 0; for (let n = 0; n < 190; n++) { const p = lib[ids[n]]; slots[s++] = {uid: uid++, name: p.name.slice(0, 23), cat: p.cat, lib: p.id}; if (rnd() < .07) s += 1 + Math.floor(rnd() * 3); }

})();

function toast(text) { const t = $('toast'); t.textContent = text; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }
function commit(fn) { if (busy) return; history.push(slots.slice()); if (history.length > 100) history.shift(); fn(); refresh(); }

function vlist(el, count, render) {

  const draw = () => { const n = count(), a = Math.max(0, Math.floor(el.scrollTop / ROW) - 5), b = Math.min(n, Math.ceil((el.scrollTop + el.clientHeight) / ROW) + 5);
    sp.style.height = n * ROW + 'px'; let h = ''; for (let i = a; i < b; i++) h += render(i, i * ROW); sp.innerHTML = n ? h : '<p class="none">' + el.dataset.none + '</p>'; };

}

function status(s) {
  const it = slots[s], b = base[s];
  if (it) { const from = baseSlot.get(it.uid); return from === undefined ? ['new', 'new'] : from !== s ? ['moved', 'from ' + pad(from + 1)] : b !== it ? ['edited', 'edited'] : null; }

}

$('llist').dataset.none = 'No sounds match. Try another search, bank or character.';
$('dlist').dataset.none = 'Nothing matches this filter.';

function chips(el, counts, active, extra) {
  el.innerHTML = `<button type="button" class="chip" data-cat="-1" aria-pressed="${active < 0}">All</button>` +
    CATS.map((c, i) => `<button type="button" class="chip" data-cat="${i}" aria-pressed="${active === i}"><i class="dot c${i}"></i>${c} <b>${num(counts[i])}</b></button>`).join('') + (extra || '');
}
function filterLib() {
  const words = fold($('lq').value).split(/\s+/).filter(Boolean), bank = $('lbank').value, sort = $('lsort').value, counts = new Array(8).fill(0), out = [];

    if (bank !== '' && p.bank !== +bank || lfav && !favs.has(p.id) || lnew && libSlot.has(p.id) || !words.every(w => p.s.includes(w))) continue;
    counts[p.cat]++; if (lcat < 0 || p.cat === lcat) out.push(p);
  }
  const byName = (a, b) => a.k < b.k ? -1 : a.k > b.k ? 1 : a.id - b.id;
  out.sort(sort === 'name' ? byName : sort === 'cat' ? (a, b) => a.cat - b.cat || byName(a, b) : (a, b) => a.id - b.id);
  lview = out.map(p => p.id);

    const it = slots[s];
    if (it) { used++; counts[it.cat]++; }
    if (pend && slots[s] === base[s]) continue;
    if (!it) { if ((pend || empty && !filtering) || (!filtering && status(s))) dview.push(s); continue; }
    if (dcat >= 0 && it.cat !== dcat || !words.every(w => fold(it.name + ' ' + bankOf(it)).includes(w))) continue;

  curSlot = new Map(); libSlot = new Map();
  slots.forEach((it, s) => { if (it) { curSlot.set(it.uid, s); if (it.lib >= 0) libSlot.set(it.lib, s); } });
  for (const u of [...dsel]) if (!curSlot.has(u)) dsel.delete(u);
  filterLib(); filterDev(); syncBar();
}
function syncBar() {
  let add = 0, mov = 0, edit = 0, rem = 0, writes = 0;
  for (let s = 0; s < SLOTS; s++) { if (slots[s] !== base[s]) writes++; const st = slots[s] && status(s); if (st) st[0] === 'new' ? add++ : st[0] === 'moved' ? mov++ : edit++; }
  for (const u of baseSlot.keys()) if (!curSlot.has(u)) rem++;
  const parts = [add && `<b>${add}</b> added`, mov && `<b>${mov}</b> moved`, edit && `<b>${edit}</b> edited`, rem && `<b>${rem}</b> removed`].filter(Boolean);
  $('syncmsg').innerHTML = busy ? 'Writing to the FM-1…' : writes ? `${parts.join(' · ')} <span class="muted">· ${num(writes)} slots to write. Your FM-1 is untouched until you sync.</span>` : '<span class="muted">Your FM-1 matches this layout. Drag sounds in, reorder or tidy up, then sync once.</span>';
  $('sync').disabled = $('discard').disabled = !writes || busy; $('sync').textContent = writes ? `Sync ${num(writes)} slots to FM-1` : 'Sync to FM-1';
  $('undo').disabled = !history.length || busy;
}

// Placing patches: insert at a slot, pushing later patches down into the next gap.
function insertAt(target, items, from = []) {
  let free = from.filter(s => s >= target).length; for (let s = target; s < SLOTS; s++) if (!slots[s]) free++;
  if (free < items.length) { toast(`Not enough room from slot ${pad(target + 1)} on. Pick an earlier slot or remove some patches.`); return; }
  commit(() => { for (const s of from) slots[s] = null;
    items.forEach((it, k) => { let carry = it, q = target + k; while (carry) { const t = slots[q]; slots[q] = carry; carry = t; q++; } }); });
}
function fromLibrary(ids) {
  const fresh = ids.filter(id => !libSlot.has(id)), skipped = ids.length - fresh.length;
  if (skipped) toast(`${skipped} already on your FM-1, skipped.`);
  return fresh.map(id => ({uid: uid++, name: lib[id].name.slice(0, 23), cat: lib[id].cat, lib: id}));
}
function addSelected() {
  const items = fromLibrary(lview.filter(id => lsel.has(id)).concat([...lsel].filter(id => !lview.includes(id)))); if (!items.length) return;
  let last = -1, used = 0; slots.forEach((it, s) => { if (it) { last = s; used++; } });
  if (used + items.length > SLOTS) return toast(`Only ${SLOTS - used} slots are free. Remove some patches first.`);
  commit(() => { let s = last + 1 + items.length <= SLOTS ? last + 1 : 0; for (const it of items) { while (slots[s]) s++; slots[s] = it; } });
  lsel.clear(); refresh(); toast(`${items.length} staged. Press Sync to write them.`);
}
const selectedSlots = () => [...dsel].map(u => curSlot.get(u)).sort((a, b) => a - b);
function arrange(how) {
  const cmp = (a, b) => fold(a.name) < fold(b.name) ? -1 : fold(a.name) > fold(b.name) ? 1 : 0;
  commit(() => { const items = slots.filter(Boolean);
    if (how === 'name') items.sort(cmp); else if (how === 'cat') items.sort((a, b) => a.cat - b.cat || cmp(a, b));
    else if (how === 'bank') items.sort((a, b) => bankOf(a).localeCompare(bankOf(b)) || cmp(a, b));
    slots = items.concat(new Array(SLOTS - items.length).fill(null)); });
}
function pick(sel, keys, k, e, anchor) {
  const key = keys[k]; if (key == null) return anchor;
  if (e.shiftKey) { for (let i = Math.min(anchor, k); i <= Math.max(anchor, k); i++) if (keys[i] != null) sel.add(keys[i]); return anchor; }
  if (e.target.dataset.act === 'pick' || e.ctrlKey || e.metaKey) sel.has(key) ? sel.delete(key) : sel.add(key);
  else { sel.clear(); sel.add(key); }
  return k;
}
const devKeys = () => dview.map(s => slots[s] ? slots[s].uid : null);

$('llist').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return; const k = +row.dataset.k, id = lview[k], act = e.target.dataset.act;
  if (act === 'fav') { favs.has(id) ? favs.delete(id) : favs.add(id); try { localStorage.setItem('sy1-proto-favs', JSON.stringify([...favs])); } catch {} return filterLib(); }
  if (act === 'play') return toast(`Prototype: “${lib[id].name}” would play right here in the page, no new tab.`);
  lanchor = pick(lsel, lview, k, e, lanchor); filterLib();
});
$('dlist').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row || e.target.matches('select, .rename')) return; const k = +row.dataset.k, s = dview[k], act = e.target.dataset.act;
  if (act === 'del') return commit(() => { slots[s] = null; });
  danchor = pick(dsel, devKeys(), k, e, danchor); filterDev();
});
$('dlist').addEventListener('change', e => {
  const row = e.target.closest('.row'); if (!row) return; const s = dview[+row.dataset.k];
  if (e.target.dataset.act === 'cat') commit(() => { slots[s] = {...slots[s], cat: +e.target.value}; });
});
$('dlist').addEventListener('dblclick', e => {
  const nm = e.target.closest('.nm'), row = e.target.closest('.row'); if (!nm || !row || row.classList.contains('empty') || busy) return;
  const s = dview[+row.dataset.k], inp = document.createElement('input'); inp.type = 'text'; inp.className = 'rename'; inp.maxLength = 23; inp.value = slots[s].name; inp.setAttribute('aria-label', 'Rename patch');
  let done = false; const end = ok => { if (done) return; done = true; const v = inp.value.trim(); if (ok && v && v !== slots[s].name) commit(() => { slots[s] = {...slots[s], name: v}; }); else filterDev(); };
  inp.onkeydown = ev => { ev.stopPropagation(); if (ev.key === 'Enter') end(true); if (ev.key === 'Escape') end(false); }; inp.onblur = () => end(true);
  nm.replaceWith(inp); inp.focus(); inp.select();
});
for (const [el, set] of [[$('lchips'), v => lcat = v], [$('dchips'), v => dcat = v]]) el.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tog === 'fav') lfav = !lfav; else if (b.dataset.tog === 'new') lnew = !lnew; else set(+b.dataset.cat);
  el === $('lchips') ? ($('llist').scrollTop = 0, filterLib()) : ($('dlist').scrollTop = 0, filterDev());
});
for (const id of ['lq', 'lbank', 'lsort']) $(id).addEventListener(id === 'lq' ? 'input' : 'change', () => { $('llist').scrollTop = 0; filterLib(); });
for (const id of ['dq', 'dempty', 'dpend']) $(id).addEventListener(id === 'dq' ? 'input' : 'change', () => { $('dlist').scrollTop = 0; filterDev(); });
$('add').onclick = addSelected;
$('map').addEventListener('click', e => { const s = e.target.dataset.s; if (s === undefined) return; const it = slots[+s];
  if (it) { dsel.clear(); dsel.add(it.uid); } filterDev(); const k = dview.indexOf(+s); if (k >= 0) { $('dlist').scrollTop = Math.max(0, k * ROW - 60); danchor = k; drawDev(); } else toast(`Slot ${pad(+s + 1)} is empty.`); });
$('remove').onclick = () => { const ss = selectedSlots(); commit(() => { for (const s of ss) slots[s] = null; }); };
$('desel').onclick = () => { dsel.clear(); filterDev(); };
$('move').onclick = () => { const t = Math.min(SLOTS, Math.max(1, parseInt($('moveto').value, 10) || 1)) - 1, ss = selectedSlots(); insertAt(t, ss.map(s => slots[s]), ss); };
for (const b of document.querySelectorAll('[data-arr]')) b.onclick = () => { arrange(b.dataset.arr); $('m-arr').open = false; toast('Staged. Check the new order, then sync.'); };

function drawSets() {
  $('setlist').innerHTML = sets.map((s, i) => `<button type="button" data-set="${i}" style="width:100%">${esc(s.name)} <span class="muted">· ${s.slots.filter(Boolean).length} patches</span></button>`).join('');
}
$('setlist').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const s = sets[+b.dataset.set]; commit(() => { slots = s.slots.slice(); }); $('m-sets').open = false; toast(`“${s.name}” staged. Sync to load it onto the FM-1.`); });
$('setsave').onclick = () => { const name = $('setname').value.trim() || 'Layout ' + (sets.length + 1); sets.push({name, slots: slots.slice()}); $('setname').value = ''; drawSets(); toast(`Saved “${name}”.`); };
document.addEventListener('click', e => { for (const m of document.querySelectorAll('details.menu[open]')) if (!m.contains(e.target)) m.open = false; });

$('undo').onclick = () => { if (!history.length || busy) return; slots = history.pop(); refresh(); };
$('discard').onclick = () => commit(() => { slots = base.slice(); });
$('sync').onclick = () => {
  let writes = 0; for (let s = 0; s < SLOTS; s++) if (slots[s] !== base[s]) writes++; if (!writes || busy) return;
  busy = true; const bar = $('prog'); bar.hidden = false; bar.max = writes; bar.value = 0; syncBar(); filterLib();
  const step = Math.max(1, Math.ceil(writes / 40)), t = setInterval(() => { bar.value = Math.min(writes, bar.value + step);
    if (bar.value >= writes) { clearInterval(t); busy = false; bar.hidden = true; base = slots.slice(); baseSlot = new Map(curSlot); history = []; refresh(); toast(`${num(writes)} slots written and confirmed (simulated).`); } }, 45);
};

// Drag from the library onto a slot, or drag slots to reorder.
$('llist').addEventListener('dragstart', e => { const row = e.target.closest('.row'); if (!row || busy) return e.preventDefault(); const id = lview[+row.dataset.k];
  if (!lsel.has(id)) { lsel.clear(); lsel.add(id); filterLib(); } drag = 'lib'; e.dataTransfer.setData('text/plain', 'sy1'); e.dataTransfer.effectAllowed = 'copy'; });
$('dlist').addEventListener('dragstart', e => { const row = e.target.closest('.row'); if (!row || busy) return e.preventDefault(); const it = slots[dview[+row.dataset.k]];
  if (!dsel.has(it.uid)) { dsel.clear(); dsel.add(it.uid); } drag = 'dev'; e.dataTransfer.setData('text/plain', 'sy1'); e.dataTransfer.effectAllowed = 'move'; });
let mark = null; const unmark = () => { if (mark) mark.classList.remove('drop'); mark = null; };
function dropSlot(e) { const row = e.target.closest('#dlist .row'), cell = e.target.closest('#map i'); return row ? [dview[+row.dataset.k], row] : cell ? [+cell.dataset.s, cell] : null; }
for (const el of [$('dlist'), $('map')]) {
  el.addEventListener('dragover', e => { if (!drag) return; e.preventDefault(); const d = dropSlot(e); if (d && d[1] !== mark) { unmark(); mark = d[1]; mark.classList.add('drop'); } });
  el.addEventListener('dragleave', e => { if (!el.contains(e.relatedTarget)) unmark(); });
  el.addEventListener('drop', e => { if (!drag) return; e.preventDefault(); const d = dropSlot(e); unmark(); let last = -1; slots.forEach((it, s) => { if (it) last = s; });
    const target = d ? d[0] : Math.min(SLOTS - 1, last + 1);
    if (drag === 'lib') { const items = fromLibrary(lview.filter(id => lsel.has(id))); if (items.length) { insertAt(target, items); lsel.clear(); refresh(); } }
    else { const ss = selectedSlots(); insertAt(target, ss.map(s => slots[s]), ss); }
    drag = null; });
}
document.addEventListener('dragend', () => { drag = null; unmark(); });

document.addEventListener('keydown', e => {
  if (e.target.matches('input, select')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === '/') { e.preventDefault(); (document.body.dataset.tab === 'dev' ? $('dq') : $('lq')).focus(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); $('undo').click(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && dsel.size) { e.preventDefault(); $('remove').click(); }
  else if (e.key === 'Escape') { lsel.clear(); dsel.clear(); refresh(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); if ($('dev').contains(document.activeElement)) { for (const u of devKeys()) if (u != null) dsel.add(u); filterDev(); } else { for (const id of lview) lsel.add(id); filterLib(); } }
});
function tab(t) { document.body.dataset.tab = t; $('tab-lib').setAttribute('aria-pressed', t === 'lib'); $('tab-dev').setAttribute('aria-pressed', t === 'dev'); drawLib(); drawDev(); }
$('tab-lib').onclick = () => tab('lib'); $('tab-dev').onclick = () => tab('dev');
window.addEventListener('resize', () => { drawLib(); drawDev(); });

$('lbank').innerHTML = '<option value="">All banks</option>' + D.banks.map((b, i) => `<option value="${i}">${esc(b[0])} (${b[2]})</option>`).join('');
slots.forEach((it, s) => { if (it) baseSlot.set(it.uid, s); });
document.body.dataset.tab = 'lib'; drawSets(); refresh();
</script>
